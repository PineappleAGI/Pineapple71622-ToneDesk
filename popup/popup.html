<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToneDesk</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1a2b33;
      --accent: #1a3a4a;
      --teal: #2a7a8c;
      --border: #e2ddd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      padding: 16px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 120% 80% at 100% -20%, rgba(42, 122, 140, 0.12), transparent 50%),
        var(--bg);
      color: var(--ink);
    }
    h1 {
      margin: 0 0 4px;
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: 1.35rem;
      color: var(--accent);
    }
    p {
      margin: 0 0 14px;
      font-size: 12px;
      color: #5a6b73;
      line-height: 1.4;
    }
    button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary {
      background: var(--accent);
      color: #fff;
    }
    .primary:hover { background: #244a5e; }
    .secondary {
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .hint {
      margin-top: 10px;
      margin-bottom: 0;
      font-size: 11px;
    }
    .status {
      font-size: 11px;
      color: var(--teal);
      min-height: 1.2em;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>ToneDesk</h1>
  <p>Professional phrases &amp; drafts — no account needed.</p>
  <div class="status" id="status"></div>
  <button type="button" class="primary" id="btn-panel">Open side panel</button>
  <button type="button" class="secondary" id="btn-window">Open in window</button>
  <p class="hint">On Gmail / LinkedIn / Slack / WhatsApp, you can also tap the 💼 button on the page.</p>
  <script src="popup.js"></script>
</body>
</html>
