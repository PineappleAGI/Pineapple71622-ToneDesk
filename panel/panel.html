<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToneDesk</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img class="brand-mark" src="../icons/brand.svg" width="28" height="28" alt="" />
        <h1>ToneDesk</h1>
      </div>
      <div class="header-actions">
        <span class="pineapple-stamp" aria-hidden="true">Built by<br>The Pineapple Project<br>Nº 71622</span>
        <button type="button" id="btn-window" class="text-btn" title="Open ToneDesk in a floating window">
          Pop out
        </button>
      </div>
    </header>

    <div class="search-bar">
      <input
        type="search"
        id="global-search"
        placeholder="Find a specific tone…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" role="tab" data-tab="rewrite" aria-selected="true">Rewrite</button>
      <button type="button" class="tab" role="tab" data-tab="write" aria-selected="false">Write</button>
      <button type="button" class="tab" role="tab" data-tab="phrases" aria-selected="false">Phrases</button>
    </nav>

    <main id="main" class="main"></main>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
