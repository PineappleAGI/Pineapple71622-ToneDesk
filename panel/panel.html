<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToneDesk</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">💼</span>
        <div>
          <h1>ToneDesk</h1>
          <p class="subtitle">Business English, on-device</p>
        </div>
      </div>
      <button type="button" id="btn-close" class="icon-btn" title="Close" aria-label="Close">✕</button>
    </header>

    <div class="search-bar">
      <input
        type="search"
        id="global-search"
        placeholder="Search phrases — e.g. follow up, say no…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" role="tab" data-tab="write" aria-selected="true">Write</button>
      <button type="button" class="tab" role="tab" data-tab="phrases" aria-selected="false">Phrases</button>
      <button type="button" class="tab" role="tab" data-tab="search" aria-selected="false">Search</button>
    </nav>

    <main id="main" class="main"></main>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
